name: CI

# Runs the full Figbridge test suite on every push to main and every PR.
# Kept separate from publish.yml so CI failures don't block manual publishes
# and so publish.yml stays focused on the release flow.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install mcp deps
        working-directory: mcp
        run: npm ci || npm install

      - name: Plugin syntax check
        run: node --check plugin/code.js

      - name: MCP smoke test
        working-directory: mcp
        run: npm test

      - name: Render pipeline unit tests
        run: node test-agent/run.js

      - name: Real-world scenarios
        run: node test/scenarios.mjs

      - name: Parsed-.fig checks
        run: node test/real-figma.mjs

      - name: MCP tool-surface e2e
        run: node test/tools-all.mjs
