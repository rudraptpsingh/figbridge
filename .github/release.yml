# Controls how GitHub auto-generates release notes from merged PRs and
# commits when a tag is pushed. Categories are matched by PR labels
# first, then by commit-message prefixes (via the release workflow).

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
      - github-actions
  categories:
    - title: "🚀 Features"
      labels:
        - "feat"
        - "feature"
        - "enhancement"
    - title: "🐛 Fixes"
      labels:
        - "fix"
        - "bug"
    - title: "📝 Docs"
      labels:
        - "docs"
        - "documentation"
    - title: "🔧 Chores & CI"
      labels:
        - "chore"
        - "ci"
        - "build"
    - title: "Other changes"
      labels:
        - "*"
